# From-scratch training on MetaQA (size B) for the L/H recursion ablation.
#
# Same recipe as cfg_graphqa.yaml -- only the token budget differs, because
# MetaQA prompts are ~3.3x longer than GraphQA ones (see `epochs` note below).
#
# Per-run CLI overrides (see slurm/train_metaqa.slurm):
#   arch/size@arch=B
#   data.path=$SCRATCH/metaqa/std_prepared
#   arch.H_cycles=<H> arch.L_cycles=<L>
#   run_name=metaqa_H<H>_L<L>
#   checkpoint_path=$SCRATCH/metaqa/ckpts/metaqa_H<H>_L<L>
defaults:
  - arch/net@arch: hrm
  - arch/size@arch: B
  - data: sft
  - _self_

hydra:
  output_subdir: null

# From scratch: no checkpoint to resume from.
resume_from: null

# W&B grouping (run_name is set per config on the CLI).
project_name: HRM-MetaQA-Ablation
run_name: null
checkpoint_path: null

# global_batch_size = packed tokens per step = FlexAttention sequence length S.
# Kept at 4096 (same as GraphQA) so the per-step attention cost is identical and
# the ablation is comparable; the longest MetaQA sample is 1367 tokens.
global_batch_size: 4096
# NOTE: prepare_sft_data.py must be run with --epochs equal to `epochs` here.
# Measured MetaQA train corpus = 7.64M tokens (7967 samples, avg 958 tokens),
# i.e. 8.6x GraphQA's 0.89M. 6 epochs ~= 11.2k optimizer steps (GraphQA's 20
# epochs ~= 4.4k). Lower this (and the matching --epochs) if the 20h job runs out.
epochs: 20
checkpoint_interval: 2

# From-scratch LR schedule (identical to GraphQA).
lr: 3.0e-4
lr_min_ratio: 0.1
lr_warmup_steps: 200

weight_decay: 0.1
beta1: 0.9
beta2: 0.95

ema: 0.999

instrumentation:
  enabled: true
  interval: 100
  token_sample: 8192
  log_eff_rank: true
  log_zgrad: true
  log_param_grads: true

# Fixed across every config so runs differ ONLY in (H_cycles, L_cycles).
seed: 0
