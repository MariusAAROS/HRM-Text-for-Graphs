name: baselines.hrm_nocarry_bp_warmup@HierarchicalReasoningModel
head: lm_head@LMHead

half_layers: True  # Divide layers by 2, split layers evenly to H and L.

# HRM config
H_cycles: 2
L_cycles: 3
H_override: {}

bp_warmup_ratio: 0.2
bp_max_steps: 5

# Backprop-through-time budget. `full_backprop: True` backprops through every cycle and
# disables the bp warmup above. Alternatively set H_bp_steps/L_bp_steps explicitly (-1 = all);
# L_bp_steps counts the last N L-applications across ALL H cycles, so its max is H_cycles*L_cycles.
full_backprop: False

# Re-inject the token embedding into every L step (original HRM / TRM).
inject_x: False
# H_bp_steps: null
# L_bp_steps: null

grad_checkpointing: False
